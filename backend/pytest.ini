[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests apps
addopts =
    --strict-markers
    --strict-config
    -ra
filterwarnings =
    error::DeprecationWarning:apps.*
    error::DeprecationWarning:config.*
    default
markers =
    slow: tests that hit the network or take more than a second
