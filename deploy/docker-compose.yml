# findajob.pro — deployed at /root/findajob/ on the VPS (SSH host `macbook-air`).
#
# This file lives in the repo at deploy/docker-compose.yml but is deployed to
# /root/findajob/docker-compose.yml, i.e. the REPOSITORY ROOT. Every relative
# path below is therefore relative to the repo root, not to deploy/.
#
# Traefik (a separate stack) routes findajob.pro -> findajob-web:80 in-network.
# NOTHING here publishes a port. Never add a `ports:` mapping.
#
# ---------------------------------------------------------------------------
# Topology
# ---------------------------------------------------------------------------
#
#   internet -> Traefik ──edge──> web (nginx)  ── serves web/ statically
#                                    │
#                                    └─ proxies /api/ ──edge──> api (Django)
#                                                                 │
#                                                    internal ────┼──> db    (postgres 16)
#                                                    (no egress)  └──> redis (cache only)
#
# `web` reaches `api` by its globally unique CONTAINER name `findajob-api`, not
# by the compose service alias `api`. The edge network is shared with unrelated
# stacks on this box, so a bare `api` alias could collide with somebody else's
# container. See deploy/nginx.conf.
#
# `api` sits on BOTH networks: `internal` for db/redis, `edge` for outbound
# internet (Brevo SMTP/API — the login OTP is sent synchronously inside the
# request) and so that Traefik can reach it the day the forwardAuth middleware
# in deploy/traefik/findajob.yml is actually attached to something.
#
# `db` and `redis` are on `internal` only, and `internal` is `internal: true`,
# so they have no route off the box in either direction.
#
# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# ONE file: `/root/findajob/.env` (repo root, next to this file). Compose reads
# it automatically for `${VAR}` interpolation below AND it is the api service's
# `env_file`, so there is exactly one place to edit. Template:
# backend/.env.example. It is gitignored and must be mode 0600.
#
# ---------------------------------------------------------------------------
# Migrations
# ---------------------------------------------------------------------------
# The api image NEVER migrates on start (see backend/docker/entrypoint.sh).
# Migrating is an explicit operator step — deploy/README.md §3.

name: findajob

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # web — the static frontend. UNCHANGED: findajob.pro must keep serving the
  # existing UI whether or not the API is up. It has no depends_on for exactly
  # that reason, and deploy/nginx.conf resolves the API lazily at request time
  # so a missing `api` container yields a 502 on /api/ instead of nginx
  # refusing to start.
  # -------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: findajob-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Django admin + DRF assets, served as /static/ (deploy/nginx.conf).
      # STATIC_ROOT only ever exists inside the api image, so the two containers
      # share it through a named volume rather than a host path — nothing on the
      # VPS filesystem holds a copy and nothing has to be rsynced.
      #
      # `:ro` because nginx has no business rewriting the admin's own
      # JavaScript, and STILL no `depends_on`: if the api has never started, the
      # volume is empty, /static/ 404s and findajob.pro keeps serving. UI-first.
      - static_data:/srv/static:ro
    networks:
      - edge
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # api — Django 6.0 + gunicorn.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: findajob-api:local
    container_name: findajob-api
    restart: unless-stopped
    # The one env file (see the header). Everything Django reads comes from
    # here; the `environment:` block below overrides the handful of values that
    # MUST match this topology regardless of what the file says.
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # CONTAINER names, not the compose aliases `db` / `redis`. The api sits on
      # the shared `edge` network too, and a bare alias resolves there as well:
      # `redis` resolved to gethub-redis (172.29.0.6), another stack's cache, so
      # every rate-limit call failed AUTH and verify-code fell closed — a
      # permanent 429 on login. `db` happens not to collide today, which is
      # exactly why it must not be left to luck either. Measured 2026-08-01.
      POSTGRES_HOST: findajob-db
      POSTGRES_PORT: "5432"
      # Built from REDIS_PASSWORD so the password has exactly one home. The
      # `:?` form makes `docker compose up` fail loudly instead of silently
      # starting an unauthenticated cache.
      # NOTE: the password is used inside a URL — generate it with
      # `openssl rand -hex 32` so it needs no percent-encoding.
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in /root/findajob/.env}@findajob-redis:6379/0"
      # collectstatic (and therefore Django's system checks, including the
      # boot-time mail check) runs on every container start. Set to 0 only for
      # one-off `docker compose run` management commands.
      DJANGO_COLLECTSTATIC: "1"
    volumes:
      # Candidate documents. Personal data under GDPR: the image creates
      # /app/media as 0700 findajob:findajob and Docker seeds the fresh named
      # volume from it, ownership included. nginx never serves this path — it
      # is delivered through an owner-checked Django view only.
      - media_data:/app/media
      # collectstatic output — Django admin + DRF assets ONLY; the product UI is
      # served by nginx straight from web/. Shared with the `web` container
      # (read-only there) so /admin/ renders styled instead of as raw HTML.
      #
      # Two behaviours make this self-maintaining. Docker seeds a NEW named
      # volume from the image directory, ownership included (uid 10001), and the
      # entrypoint re-runs collectstatic on every start with
      # DJANGO_COLLECTSTATIC=1 — so a rebuilt image refreshes the volume with no
      # manual step. collectstatic overwrites but never deletes, so the
      # content-hashed file a browser loaded seconds before a deploy is still
      # there afterwards.
      #
      # The api process runs as uid 10001 and nginx's workers as uid 101, so the
      # collected files have to be world-readable. They are not by default:
      # FILE_UPLOAD_PERMISSIONS=0o600 / FILE_UPLOAD_DIRECTORY_PERMISSIONS=0o700
      # (correct for uploaded documents) are what FileSystemStorage falls back
      # to, and collectstatic used them until STORAGES['staticfiles']['OPTIONS']
      # in config/settings pinned 0644/0755. Measured: without that, every
      # /static/ request is a 403 and the admin renders unstyled.
      - static_data:/app/staticfiles
      # `manage.py seed_legal` deliberately reads the SAME legal.js that nginx
      # serves, so the hashed consent text can never drift from the rendered
      # text. settings.REPO_ROOT is BASE_DIR.parent = "/" in this image, hence
      # /web. Read-only: the API must never be able to rewrite the contract.
      - ./web:/web:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - edge
    # Long enough for gunicorn's graceful_timeout (30 s) to drain in-flight
    # requests instead of Docker SIGKILLing mid-response.
    stop_grace_period: 40s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # db — PostgreSQL 16. Sessions live here (not in Redis), which is why a Redis
  # outage throttles logins loosely instead of logging everybody out.
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: findajob-db
    restart: unless-stopped
    # Explicit environment rather than `env_file: .env`: the database container
    # has no business holding SECRET_KEY, the Brevo credentials or the session
    # settings in its process environment.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findajob}
      POSTGRES_USER: ${POSTGRES_USER:-findajob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in /root/findajob/.env}
      # scram-sha-256 is the default in PG16; stated so a future edit cannot
      # quietly downgrade it. --data-checksums only applies on first initdb.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      # -h 127.0.0.1 forces a real TCP handshake; without it pg_isready can
      # succeed against the unix socket while the listener is not up yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # redis — CACHE ONLY (OTP rate-limit budgets, spec §5). Never a queue, never
  # a session store, never the source of truth for anything.
  #
  # SECURITY — the review blocked on an unauthenticated Redis. Four controls:
  #   1. no `ports:` — nothing is published to the host or the internet;
  #   2. attached ONLY to `internal`, which is `internal: true`, so it is
  #      unreachable from the shared edge network the other stacks live on;
  #   3. `--requirepass`, sourced from REDIS_PASSWORD, mandatory (`:?`);
  #   4. no persistence at all (`--save ''`, `--appendonly no`) — cache
  #      contents, including rate-limit keys, never touch disk.
  #
  # The password is passed as a command-line argument, so it is visible in
  # `ps` inside this container and in `docker inspect`. Both already require
  # root on the VPS, which is also all it takes to read /root/findajob/.env —
  # so this leaks nothing new. It is done this way on purpose to avoid a
  # second single-file bind mount: rsync replaces files by rename, Docker
  # binds them by inode, and the container then serves the OLD file while
  # `nginx -t`-style validation reports success (see the findajob-deploy skill).
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: findajob-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in /root/findajob/.env}
    # Exec form (a YAML list), not a bare string: Compose shell-splits a string
    # command, and `--save ""` has to survive as a genuinely empty argument.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --save ""
        --appendonly no
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --databases 2
        --loglevel notice
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  # Shared with unrelated stacks on this box (n8n, wordpress, rotocon, …).
  # Traefik lives here. Only `web` and `api` are attached.
  edge:
    external: true
    name: gethub_gethub-network

  # `internal: true` = no gateway, no NAT, no route on or off the host. db and
  # redis need neither, and api keeps its internet egress through `edge`.
  # Verify after deploying (deploy/README.md §5): if egress ever breaks, the
  # one-line fallback is to drop `internal: true` here — the other three Redis
  # controls above still stand on their own.
  internal:
    driver: bridge
    internal: true
    name: findajob-internal

volumes:
  pg_data:
    name: findajob_pg_data
  media_data:
    name: findajob_media_data
  # Rebuildable by definition — `collectstatic` regenerates it on every api
  # start — so unlike pg_data and media_data this one may safely be removed and
  # recreated: `docker volume rm findajob_static_data` then restart the api.
  static_data:
    name: findajob_static_data
