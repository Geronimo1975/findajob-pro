server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Traefik terminates TLS; a bare `return 302 /path` must not be rewritten to http://
    absolute_redirect off;

    # Traefik's secure-headers middleware already sets HSTS, X-Content-Type-Options and
    # Referrer-Policy. These are the ones it does not set.
    # CSP note: the .dc runtime evaluates its page script via `new Function`, and the whole
    # prototype is styled with inline styles — hence unsafe-eval / unsafe-inline. What the
    # policy does buy is that NO third-party origin can be contacted, which is the
    # GDPR-relevant part, plus no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # woff2 is already compressed — do not re-compress

    # HTML always fresh: deploys are a plain rsync with no restart.
    # `expires` (not add_header) on purpose — an add_header inside a location drops every
    # header inherited from the server block, which would silently kill the CSP above.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(js|css|svg|png|woff2?|ico|txt|xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    location = /app {
        return 302 /app.html;
    }

    # No SPA fallback: this is a two-page static site, so an unknown path must 404 rather
    # than serve the landing page with a 200 (a soft 404 that also made /robots.txt resolve).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
