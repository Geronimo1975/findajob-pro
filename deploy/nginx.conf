# findajob.pro — nginx (container findajob-web), mounted at
# /etc/nginx/conf.d/default.conf. That path is inside the `http` context, which
# is why the `map` below is legal here.
#
# Chain: internet -> Traefik (TLS, secure-headers, compress) -> nginx -> either
# the static files in web/ or, for /api/ and /admin/, the Django container
# findajob-api. /static/ (Django admin + DRF assets) comes off the shared
# `static_data` volume that the api container's collectstatic writes.
#
# NOT proxied, on purpose: /media/. Candidate documents are personal data and
# are delivered only through an owner-checked Django view. There is no nginx
# location for MEDIA_ROOT anywhere in this file and there must never be one.

# X-Forwarded-Proto passthrough. Django's config.settings.prod sets
# SECURE_PROXY_SSL_HEADER=('HTTP_X_FORWARDED_PROTO','https') AND
# SECURE_SSL_REDIRECT=True: forward the container-local $scheme ("http") and
# Django answers every API call with a 301 to https, which the browser follows
# back to the same place — an infinite redirect on /api/.
#
# Trusting the inbound header is safe here specifically because this container
# publishes no ports: the only thing that can reach it is Traefik, which
# overwrites X-Forwarded-Proto on every request. $scheme is the fallback for a
# direct in-network call (e.g. a debugging curl from another container).
map $http_x_forwarded_proto $findajob_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Traefik terminates TLS; a bare `return 302 /path` must not be rewritten to http://
    absolute_redirect off;

    # Traefik's secure-headers middleware already sets HSTS, X-Content-Type-Options and
    # Referrer-Policy. These are the ones it does not set.
    # CSP note: the .dc runtime evaluates its page script via `new Function`, and the whole
    # prototype is styled with inline styles — hence unsafe-eval / unsafe-inline. What the
    # policy buys is that almost no third-party origin can be contacted, plus no framing.
    # `connect-src 'self'` already covers the API: /api/ is same-origin by
    # construction, which is the whole reason the session cookie needs no CORS.
    #
    # The Google origins below are the ONE deliberate exception, for Google Analytics 4
    # (G-5SH3ZXQD6C). Read this before widening it further:
    #   - googletagmanager.com in script-src serves gtag.js itself.
    #   - google-analytics.com / analytics.google.com in connect-src take the hits
    #     (GA4 posts via fetch/beacon, not the old pixel), and img-src covers the
    #     no-JS fallback pixel some blockers force it down to.
    #     The wildcards are REQUIRED, not laziness: GA4 does not post to
    #     www.google-analytics.com but to a regional endpoint chosen at runtime —
    #     an EU visitor hits region1.google-analytics.com. Pinning only the www
    #     host silently blocks every hit while gtag.js still loads, which looks
    #     exactly like "analytics configured but reporting zero traffic".
    #   - Ad/remarketing origins (doubleclick.net, googleadservices.com) are absent on
    #     purpose. analytics.js pins ad_storage/ad_user_data/ad_personalization to
    #     'denied', so if a hit ever needs those hosts, something re-enabled advertising
    #     features — fix that, do not add the host.
    # The CSP is NOT the consent gate. Consent is enforced in web/analytics.js, which
    # never injects the script until the visitor accepts; these directives only stop
    # the browser from blocking it afterwards.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # woff2 is already compressed — do not re-compress

    # ---------------------------------------------------------------------
    # API — proxied to the Django container.
    # ---------------------------------------------------------------------
    # `^~` so that no regex location below (they are evaluated before ordinary
    # prefix locations) can ever steal an API path.
    #
    # THE RESOLVER IS LOAD-BEARING, NOT A DETAIL. With a literal
    # `proxy_pass http://findajob-api:8000;`, nginx resolves that name ONCE at
    # startup and REFUSES TO START if it does not exist. The API container is
    # built, rebuilt, migrated and occasionally down; the static site must not
    # be. Resolving through a variable defers the lookup to request time, so a
    # missing API is a 502 on /api/ and findajob.pro keeps serving.
    #
    # 127.0.0.11 is Docker's embedded DNS (present on user-defined networks).
    # ipv6=off: it answers AAAA with NXDOMAIN-ish results that nginx logs as
    # errors on every request otherwise.
    #
    # A variable in proxy_pass also disables nginx's automatic URI pass-through,
    # so $request_uri is appended by hand. It carries the query string and the
    # original, un-normalised path — which is what Django's URL resolver and
    # CSRF referer checks expect.
    location ^~ /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        # Container name, not the compose alias `api`: the edge network is
        # shared with unrelated stacks and `api` is a name anyone could take.
        set $findajob_api "http://findajob-api:8000";
        proxy_pass $findajob_api$request_uri;

        proxy_http_version 1.1;
        # Clear the hop-by-hop Connection header so upstream keepalive works.
        proxy_set_header Connection "";

        # Host is preserved verbatim. Traefik has passHostHeader: true, so this
        # is the real `findajob.pro`, which is what ALLOWED_HOSTS and the
        # CSRF_TRUSTED_ORIGINS check are configured against.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $findajob_forwarded_proto;
        # Appends nginx's own peer (Traefik) to whatever Traefik sent, so the
        # header reads "<client>, <traefik-ip>". The client is the FIRST entry
        # and there are exactly two trusted hops. See deploy/README.md §6 —
        # Django currently sees REMOTE_ADDR = this container, so the per-IP OTP
        # budget in spec §5 needs a client-IP resolver on the Django side.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # 5 s to connect (in-network, so anything slower is a dead container).
        # 60 s to read: the login OTP mail is sent synchronously inside the
        # request with a 5 s budget, and gunicorn's own worker timeout is 30 s,
        # so nginx should never be the component that gives up first.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Django's DATA_UPLOAD_MAX_MEMORY_SIZE is 5 MB; leave room for the
        # multipart envelope and let Django produce the error, not nginx.
        client_max_body_size 12m;
        client_body_timeout  30s;

        # Upstream Location/Refresh headers are already absolute and correct.
        proxy_redirect off;

        # Deliberately NO add_header here. A single add_header inside a
        # location drops every header inherited from the server block; with
        # none, the CSP / X-Frame-Options / Permissions-Policy above still
        # apply to API responses.
    }

    # MCP endpoint (docs/superpowers/specs/2026-09-26-mcp-server-design.md).
    # Same upstream as /api/. Bearer-only and JSON-RPC, so no cookie or CSRF
    # concerns; the 256 KB body cap is enforced by Django, 1m here is slack.
    location ^~ /mcp/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $findajob_api "http://findajob-api:8000";
        proxy_pass $findajob_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $findajob_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 1m;
        client_body_timeout  30s;

        proxy_redirect off;
    }

    # Bare /mcp -> /mcp/. 308, not 301: clients must re-POST the JSON-RPC body.
    location = /mcp { return 308 /mcp/; }

    # The dashboard. `apps.dashboard` is server-rendered Django mounted at /app/
    # (design: docs/superpowers/specs/2026-10-18-jobick-dashboard-design.md), so
    # it proxies to the SAME upstream as /api/, not to the static web/ root. Its
    # vendored assets live under /static/dashboard_app/ and are served by the
    # /static/ block below off the shared static_data volume (collectstatic). The
    # page carries inline <script> (the no-flash theme toggle); deliberately NO
    # add_header here so the server-block CSP (which includes 'unsafe-inline' for
    # script-src) still applies — an add_header would drop it.
    location ^~ /app/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $findajob_api "http://findajob-api:8000";
        proxy_pass $findajob_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $findajob_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 1m;
        client_body_timeout  30s;

        proxy_redirect off;
    }

    # ---------------------------------------------------------------------
    # Django admin — same upstream as /api/, TWO independent gates in front.
    # ---------------------------------------------------------------------
    #   1. Traefik basicAuth. deploy/traefik/findajob.yml defines a SECOND
    #      router, `findajob-admin`, matching Host(findajob.pro) && /admin,
    #      at a higher priority than the main one. An anonymous request is
    #      answered 401 by Traefik and never reaches this block.
    #   2. Django's own superuser login (is_staff + is_active) behind it.
    #
    # nginx deliberately adds no third gate: a credential here would be a third
    # thing to rotate, and the two above already fail closed independently.
    #
    # CAVEAT, stated so nobody has to rediscover it: gate 1 lives at Traefik,
    # and this container sits on the SHARED `gethub_gethub-network`. Any other
    # container on that network can reach findajob-web:80 directly and skip
    # Traefik — exactly as it already can for /api/. Django's staff login is
    # the gate that always applies; basicAuth is what keeps the internet away
    # from it.
    #
    # The lazy resolver is here for the same reason as on /api/: a missing or
    # rebuilding API container must be a 502 on /admin/, never a config that
    # stops nginx from booting and takes findajob.pro down with it.
    location ^~ /admin/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $findajob_api_admin "http://findajob-api:8000";
        proxy_pass $findajob_api_admin$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host verbatim, exactly as on /api/. Django admin's login POST is
        # CSRF-checked against the Origin header, which the browser sets to
        # https://findajob.pro — that has to match ALLOWED_HOSTS and
        # CSRF_TRUSTED_ORIGINS, and it only does if Host survives the hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        # Load-bearing twice over: config.settings.prod sets both
        # SECURE_SSL_REDIRECT=True and SECURE_PROXY_SSL_HEADER, so without a
        # truthful "https" here every admin page 301s to itself forever, and
        # Django would also refuse to honour the Secure session cookie it just
        # issued.
        proxy_set_header X-Forwarded-Proto $findajob_forwarded_proto;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Same envelope allowance as /api/: let Django's
        # DATA_UPLOAD_MAX_MEMORY_SIZE (5 MB) produce the error, not nginx.
        client_max_body_size 12m;
        client_body_timeout  30s;

        proxy_redirect off;

        # No add_header — see the note at the end of the /api/ block. The
        # server-level CSP applies to admin pages and is permissive enough for
        # them (script-src/style-src carry 'unsafe-inline'); everything the
        # admin loads is same-origin under /static/.
    }

    # Django's CommonMiddleware would APPEND_SLASH this, but only if the
    # request reached Django — and `location ^~ /admin/` does not match a
    # slashless /admin, so it would fall through to the `=404` rule below.
    # Traefik's admin router matches both spellings, so this redirect happens
    # behind the gate, not in front of it.
    location = /admin {
        return 302 /admin/;
    }

    # ---------------------------------------------------------------------
    # /static/ — Django admin + DRF assets only.
    # ---------------------------------------------------------------------
    # The product UI is NOT here: it is the plain files under web/, served by
    # the `location /` rule at the bottom. STATIC_ROOT lives inside the api
    # image, so the two containers share it through the named volume
    # `static_data` (deploy/docker-compose.yml), mounted here read-only at
    # /srv/static and rewritten by the api entrypoint's collectstatic on every
    # container start.
    #
    # `root /srv`, not `alias /srv/static/`: root composes to exactly the same
    # path here (/srv + /static/… = /srv/static/…) and sidesteps the classic
    # alias-plus-try_files footgun.
    #
    # `^~` so the generic `\.(js|css|…)$` regex rule below — 1 hour — can never
    # take these instead. 30 days is correct precisely because production uses
    # ManifestStaticFilesStorage: every URL the admin emits is content-hashed
    # (…/base.428a30193bdc.css), so the name changes whenever the bytes do.
    #
    # `expires`, never `add_header`: one add_header inside a location drops
    # every header inherited from the server block, CSP included.
    #
    # `web` has no depends_on for the api, so before the API's first successful
    # start this volume is empty and /static/ simply 404s. That is the intended
    # failure: findajob.pro keeps serving either way.
    location ^~ /static/ {
        root /srv;
        expires 30d;
        try_files $uri =404;
    }

    # Django's internal unhashed -> hashed filename map. Not secret, but no
    # browser asks for it and it enumerates every asset path Django knows
    # about. An exact-match location outranks the `^~` prefix above.
    location = /static/staticfiles.json {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Caching
    # ---------------------------------------------------------------------
    # HTML always fresh: deploys are a plain rsync with no restart.
    # `expires` (not add_header) on purpose — an add_header inside a location
    # drops every header inherited from the server block, which would silently
    # kill the CSP above.
    #
    # /auth.html is covered by this rule (it matches \.html$) and is called out
    # explicitly because it is the one page where a stale copy is a security
    # problem, not just a cosmetic one: it is the login screen, it reads the
    # csrftoken cookie and it must always match the current API contract.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # The app-shell scripts share the .html files' release cycle and MUST share
    # their cache policy. api.js in particular declares ENDPOINTS and the CSRF
    # helper: cached for an hour while app.html / auth.html are not, a deploy
    # leaves a browser running new HTML against an old client for up to an
    # hour — calling endpoints that no longer exist, or omitting the
    # X-CSRFToken header and getting a 403 on every login attempt. legal.js and
    # support.js desynchronise the same way (consent texts, and the runtime
    # that renders both pages).
    #
    # This block MUST stay above the generic asset rule below: regex locations
    # are tried in order and the first match wins.
    #
    # vendor/ (React UMD, SRI-pinned) and fonts/ are genuinely immutable and
    # keep the long cache.
    location ~* ^/(api|support|legal)\.js$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(js|css|svg|png|woff2?|ico|txt|xml)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Bare /app -> the server-rendered dashboard at /app/ (was /app.html, the
    # archived React prototype). The old prototype still resolves at /app.html.
    location = /app {
        return 302 /app/;
    }

    # Same convenience redirect for the login page. $is_args$args keeps the
    # ?next=… the app.html bootstrap appends when GET /api/v1/me/ returns 401.
    location = /auth {
        return 302 /auth.html$is_args$args;
    }

    # No SPA fallback: this is a small multi-page static site, so an unknown path must
    # 404 rather than serve the landing page with a 200 (a soft 404 that also made
    # /robots.txt resolve).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
