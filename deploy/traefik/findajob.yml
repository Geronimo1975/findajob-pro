# Traefik dynamic route: findajob.pro -> findajob-web (nginx :80, static UI-first frontend)
# Deployed to /opt/gethub/traefik/dynamic/findajob.yml on the VPS (macbook-air).
# Traefik already redirects http -> https globally (verified: http://findajob.pro returns 308).
#
# TRAEFIK v2.11 (`traefik:v2.11`, container `gethub-traefik`). The file provider
# reads the whole of /etc/traefik/dynamic with watch:true, parsing ONLY
# .yml/.yaml/.toml — every other extension in that directory is ignored, which
# is what makes the .htpasswd file referenced below safe to put beside this one.
# `secure-headers` and `compress` are defined in that directory's
# middlewares.yml, not here; cross-file references work because the file
# provider merges the directory into one configuration.
#
# There is exactly ONE upstream: nginx. /api/ and /admin/ are proxied to the
# Django container by nginx itself (deploy/nginx.conf), not by a second Traefik
# service — that is what keeps the frontend and the API same-origin, which is
# what lets the session cookie work with no CORS at all (spec §8).
http:
  routers:
    # www.findajob.pro is DNS-live, so without this it served a bare Traefik 404.
    # Redirect it to the apex rather than serving the site on two hostnames.
    findajob-www:
      rule: "Host(`www.findajob.pro`)"
      entryPoints: [websecure]
      service: findajob
      tls:
        certResolver: letsencrypt
      middlewares: [findajob-www-to-apex]

    findajob:
      rule: "Host(`findajob.pro`)"
      entryPoints: [websecure]
      service: findajob
      tls:
        certResolver: letsencrypt
      middlewares: [secure-headers, compress]
      # Explicit, so the admin router below cannot lose on a rule-length
      # technicality. Traefik's default priority is the rule's character count,
      # which happens to favour the longer admin rule already — but "happens to"
      # is not a security control. Higher number wins.
      priority: 10

    # -----------------------------------------------------------------------
    # The admin gate. Same host, same upstream, one extra middleware.
    # -----------------------------------------------------------------------
    # This is deliberately a SECOND ROUTER rather than basicAuth on the main
    # one: everything except /admin must stay open (spec §7 — the public demo
    # needs the shell reachable by anyone), so the credential has to be scoped
    # to the path, and a router is the only place Traefik lets you scope it.
    #
    # Rule shape, and why it is not a bare PathPrefix(`/admin`): in Traefik 2.x
    # PathPrefix is a raw string prefix, so `/admin` would also match a future
    # `/administration` or `/admin-export`. Spelling out the trailing slash plus
    # the exact slashless form matches precisely the two things nginx serves
    # (`location ^~ /admin/` and `location = /admin`) and nothing else.
    #
    # NOT covered, on purpose: /static/. The admin's stylesheets have to load,
    # they contain nothing private, and gating them would mean the browser
    # re-authenticating for every asset.
    findajob-admin:
      # BOTH hostnames. www.findajob.pro routes to the SAME nginx service, which
      # carries the same `location ^~ /admin/` proxy — so gating only the apex
      # left https://www.findajob.pro/admin/ reachable with no basicAuth at all.
      # The www router's redirect-to-apex is not a security control: it is a
      # middleware on a router that would otherwise have served the request, and
      # relying on a redirect to protect an admin surface is fail-open.
      rule: "(Host(`findajob.pro`) || Host(`www.findajob.pro`)) && (PathPrefix(`/admin/`) || Path(`/admin`))"
      entryPoints: [websecure]
      service: findajob
      tls:
        certResolver: letsencrypt
      # Order matters: basicAuth first, so an anonymous request is answered 401
      # by Traefik and never touches nginx, Django or the database.
      middlewares: [findajob-admin-auth, secure-headers, compress]
      priority: 100

  middlewares:
    # -----------------------------------------------------------------------
    # Gate 1 of 2 in front of Django admin (gate 2 is the superuser login).
    # -----------------------------------------------------------------------
    # usersFile, NOT inline `users`. Both work in Traefik 2.11; the deciding
    # factor is this repo's deploy model. `deploy/traefik/findajob.yml` is a
    # tracked file that gets scp'd to the VPS, so an inline `users:` entry would
    # commit a bcrypt hash of the admin password to git and push it to GitHub —
    # offline-crackable, and impossible to rotate without a commit. A usersFile
    # keeps the credential on the VPS only: the deploy copies this .yml and
    # nothing else, so the .htpasswd survives every deploy untouched, and
    # rotating it is one command with no code change.
    #
    # Two smaller reasons the same way: inline users in YAML are a list of
    # strings containing `$`, which people reflexively escape as `$$` (correct
    # for docker-compose labels, WRONG here — it produces a hash that matches
    # nothing and a 401 nobody can explain); and a file can be chmod 600 while a
    # config value cannot.
    #
    # The path is inside the Traefik container. /opt/gethub/traefik/dynamic on
    # the host is bind-mounted read-only to /etc/traefik/dynamic, and the file
    # provider ignores non-.yml/.yaml/.toml files, so the .htpasswd can live
    # beside this file without being parsed as configuration.
    #
    # CREATE IT ON THE VPS — do not commit it, and do not invent a password:
    #
    #   ssh macbook-air
    #   htpasswd -B -c /opt/gethub/traefik/dynamic/findajob-admin.htpasswd findajob-admin
    #   chmod 600 /opt/gethub/traefik/dynamic/findajob-admin.htpasswd
    #   # -B  = bcrypt (Traefik supports MD5/SHA1/BCrypt; bcrypt is the only
    #   #       one worth using). -c CREATES, so omit it when adding a 2nd user.
    #   # htpasswd is already installed at /usr/bin/htpasswd on this box.
    #   # Non-interactive equivalent, if you must:
    #   #   htpasswd -nbB findajob-admin '<password>' >> <file>
    #   # Generate the password with:  openssl rand -base64 24
    #
    # Traefik reads usersFile when it builds the middleware, and the file
    # provider watches the DIRECTORY for changes. Editing only the .htpasswd may
    # not trigger a rebuild — after rotating a credential,
    # `touch /opt/gethub/traefik/dynamic/findajob.yml` to force one.
    #
    # If the file is missing, Traefik logs an error and the middleware rejects
    # every request. That is the correct failure direction: /admin 401s, the
    # rest of findajob.pro is served by the other router and is unaffected.
    findajob-admin-auth:
      basicAuth:
        usersFile: "/etc/traefik/dynamic/findajob-admin.htpasswd"
        realm: "findajob.pro admin"
        # Strip Authorization before proxying. Django never looks at it, and a
        # forwarded basicAuth header is a credential sitting in gunicorn's
        # request environment for no reason.
        removeHeader: true

    findajob-www-to-apex:
      redirectRegex:
        regex: "^https://www\\.findajob\\.pro/(.*)"
        replacement: "https://findajob.pro/${1}"
        permanent: true

    # -----------------------------------------------------------------------
    # DEFINED, DELIBERATELY ATTACHED TO NOTHING.
    # -----------------------------------------------------------------------
    # Do not add `findajob-forward-auth` to the `findajob` router's middlewares
    # list. Spec §7 settles this: forwardAuth gates the SHELL, and the public
    # demo requires the shell to stay reachable by anyone. index.html and
    # app.html contain no user data — only the layout and the api.js demo
    # fixtures — so gating them would break the demo while protecting nothing.
    #
    # THE REAL GATE IS THE API. Every /api/v1/* route requires an authenticated
    # session except auth/*, legal/* and i18n/*, enforced by DRF's default
    # IsAuthenticated permission in config/settings/base.py. app.html bootstraps
    # by calling GET /api/v1/me/ and redirects to /auth.html?next=… on 401.
    #
    # And it is NOT the gate on /admin either, even though /admin is the first
    # non-public surface here. forwardAuth would make the admin gate depend on
    # the API answering — so a Django outage, the single most likely reason to
    # want the admin, would lock you out of it. Worse, the check it points at
    # (`/api/v1/auth/_check/`) does not exist yet, so attaching it today 401s
    # everything. basicAuth is stateless, needs no application, and fails closed
    # on its own; see `findajob-admin-auth` above.
    #
    # This block stays for the case it is actually shaped for: a surface that
    # needs the *application's* notion of identity at the edge — per-user or
    # per-org routing, a metrics host restricted to staff sessions.
    #
    # The `address` points at findajob-api directly (Traefik and the api
    # container share the gethub_gethub-network), NOT through nginx: a gate
    # must not depend on the thing it is gating being able to route to it.
    # `/api/v1/auth/_check/` is a future endpoint — apps.accounts does not
    # implement it yet, which is another reason nothing may reference this
    # middleware today. It is expected to answer 2xx for an authenticated
    # session and 401/403 otherwise, and to touch no state.
    findajob-forward-auth:
      forwardAuth:
        address: "http://findajob-api:8000/api/v1/auth/_check/"
        # Pass X-Forwarded-* through so Django sees the real scheme and host;
        # the api container has no route to the internet-facing hostname
        # otherwise, and SECURE_PROXY_SSL_HEADER depends on X-Forwarded-Proto.
        trustForwardHeader: true
        # `authRequestHeaders` is deliberately NOT set. Unset means "copy every
        # request header", which is what a session check needs — filtering the
        # list down is how people accidentally drop `Cookie` and get a
        # middleware that 401s every request including their own.
        # Identity the check hands back to the protected upstream. Nothing
        # consumes these yet; they are here so the contract is explicit.
        authResponseHeaders:
          - "X-Findajob-User"
          - "X-Findajob-Org"

  services:
    findajob:
      loadBalancer:
        servers:
          - url: "http://findajob-web:80"
        passHostHeader: true
